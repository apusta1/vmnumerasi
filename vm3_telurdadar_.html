<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Resep Telur Dadar — Mobile Touch Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', sans-serif;
        }

        body {
            background: #f7f2e0;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .vm-wrapper {
            max-width: 1000px;
            width: 100%;
            background: #fffef5;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 24px 28px 32px;
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin: 0 0 6px 0;
            color: #c16f2e;
        }
        
        /* Tambahan style untuk testing */
        .check-result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 12px;
            font-family: monospace;
        }
        
        .status {
            margin: 5px 0;
            padding: 8px;
            border-radius: 8px;
        }
        
        .valid {
            background: #d4edda;
            color: #155724;
        }
        
        .invalid {
            background: #f8d7da;
            color: #721c24;
        }
        
        button {
            background: #c16f2e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        button:hover {
            background: #a5581c;
        }
        
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="vm-wrapper">
        <h1>Resep Telur Dadar — Mobile Touch Optimized</h1>
        
        <!-- Form input untuk testing -->
        <div style="margin: 20px 0;">
            <h3>Test Pengecekan Bahan:</h3>
            <input type="text" id="daunBawangInput" placeholder="Nilai Daun Bawang">
            <input type="text" id="bawangMerahInput" placeholder="Nilai Bawang Merah">
            <button onclick="testPengecekan()">Cek Bahan</button>
        </div>
        
        <div class="check-result" id="resultArea">
            <!-- Hasil pengecekan akan ditampilkan di sini -->
        </div>
    </div>

    <script>
        // Fungsi pengecekan nilai Daun Bawang dan Bawang Merah secara terpisah
        function cekNilaiDaunBawang(nilai) {
            // Pengecekan khusus untuk Daun Bawang
            // Sesuaikan dengan kriteria validasi Daun Bawang
            const nilaiString = String(nilai).toLowerCase().trim();
            
            // Contoh kriteria Daun Bawang yang valid
            const validDaunBawang = ['ada', 'tersedia', 'punya', '1', 'true', 'ya', 'yes'];
            
            // Cek apakah nilai masuk kriteria valid
            const isValid = validDaunBawang.includes(nilaiString);
            
            return {
                valid: isValid,
                nilai: nilai,
                pesan: isValid ? 'Daun Bawang valid ✅' : 'Daun Bawang tidak valid ❌'
            };
        }
        
        function cekNilaiBawangMerah(nilai) {
            // Pengecekan khusus untuk Bawang Merah
            const nilaiString = String(nilai).toLowerCase().trim();
            
            // Contoh kriteria Bawang Merah yang valid
            const validBawangMerah = ['ada', 'tersedia', 'punya', '1', 'true', 'ya', 'yes'];
            
            const isValid = validBawangMerah.includes(nilaiString);
            
            return {
                valid: isValid,
                nilai: nilai,
                pesan: isValid ? 'Bawang Merah valid ✅' : 'Bawang Merah tidak valid ❌'
            };
        }
        
        // Fungsi utama untuk mengecek kedua bahan secara terpisah
        function cekKetersediaanBahan(daunBawang, bawangMerah) {
            // Pengecekan terpisah untuk masing-masing bahan
            const hasilDaunBawang = cekNilaiDaunBawang(daunBawang);
            const hasilBawangMerah = cekNilaiBawangMerah(bawangMerah);
            
            // Logika kombinasi (bisa disesuaikan)
            const keduaTersedia = hasilDaunBawang.valid && hasilBawangMerah.valid;
            const salahSatuTersedia = hasilDaunBawang.valid || hasilBawangMerah.valid;
            
            return {
                daunBawang: hasilDaunBawang,
                bawangMerah: hasilBawangMerah,
                keduaTersedia: keduaTersedia,
                salahSatuTersedia: salahSatuTersedia
            };
        }
        
        // Fungsi untuk testing
        function testPengecekan() {
            const daunBawangValue = document.getElementById('daunBawangInput').value;
            const bawangMerahValue = document.getElementById('bawangMerahInput').value;
            
            const hasil = cekKetersediaanBahan(daunBawangValue, bawangMerahValue);
            
            // Tampilkan hasil
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `
                <h4>Hasil Pengecekan Terpisah:</h4>
                <div class="status ${hasil.daunBawang.valid ? 'valid' : 'invalid'}">
                    🧅 Daun Bawang: ${hasil.daunBawang.pesan} (Nilai: "${hasil.daunBawang.nilai}")
                </div>
                <div class="status ${hasil.bawangMerah.valid ? 'valid' : 'invalid'}">
                    🧄 Bawang Merah: ${hasil.bawangMerah.pesan} (Nilai: "${hasil.bawangMerah.nilai}")
                </div>
                <div class="status ${hasil.keduaTersedia ? 'valid' : 'invalid'}">
                    📊 Kedua bahan tersedia: ${hasil.keduaTersedia ? 'Ya ✅' : 'Tidak ❌'}
                </div>
                <div class="status ${hasil.salahSatuTersedia ? 'valid' : 'invalid'}">
                    📊 Salah satu bahan tersedia: ${hasil.salahSatuTersedia ? 'Ya ✅' : 'Tidak ❌'}
                </div>
            `;
            
            console.log('Hasil pengecekan detail:', hasil);
        }
        
        // Contoh penggunaan dalam resep telur dadar
        function cekBahanUntukResep(daunBawang, bawangMerah) {
            const hasil = cekKetersediaanBahan(daunBawang, bawangMerah);
            
            if (hasil.keduaTersedia) {
                return "✅ Bahan lengkap! Bisa membuat telur dadar dengan daun bawang dan bawang merah.";
            } else if (hasil.salahSatuTersedia) {
                return "⚠️ Hanya satu bahan tersedia. Telur dadar tetap bisa dibuat dengan rasa berbeda.";
            } else {
                return "❌ Maaf, kedua bahan tidak tersedia. Telur dadar polos tanpa daun bawang dan bawang merah.";
            }
        }
        
        // Demo otomatis saat halaman dimuat
        window.addEventListener('DOMContentLoaded', function() {
            console.log("=== Demo Pengecekan Terpisah ===");
            
            // Test case 1: Kedua bahan tersedia
            console.log("Test 1 - Kedua tersedia:", cekBahanUntukResep("ada", "tersedia"));
            
            // Test case 2: Hanya daun bawang yang tersedia
            console.log("Test 2 - Hanya daun bawang:", cekBahanUntukResep("punya", "tidak ada"));
            
            // Test case 3: Hanya bawang merah yang tersedia
            console.log("Test 3 - Hanya bawang merah:", cekBahanUntukResep("kosong", "yes"));
            
            // Test case 4: Kedua tidak tersedia
            console.log("Test 4 - Kedua tidak ada:", cekBahanUntukResep("tidak", "no"));
            
            // Set nilai default di input untuk testing
            document.getElementById('daunBawangInput').value = 'ada';
            document.getElementById('bawangMerahInput').value = 'tersedia';
            testPengecekan();
        });
    </script>
</body>
</html>
