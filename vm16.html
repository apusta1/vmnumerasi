<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Urutan Nama</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --secondary: #2196F3;
            --secondary-dark: #1976D2;
            --bg: #fcdbbd;
            --text-dark: #2c3e2f;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* LANDSCAPE WARNING - Muncul hanya saat portrait di HP */
        #landscape-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e2f, #1e3a2a);
            color: #f9e7c2;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 10000;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        #landscape-warning h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            background: rgba(0,0,0,0.4);
            padding: 12px 24px;
            border-radius: 60px;
        }

        #landscape-warning p {
            font-size: 1.2rem;
            max-width: 280px;
            margin: 20px auto;
        }

        .rotate-icon {
            font-size: 4rem;
            animation: rotateAnim 1.5s infinite ease;
            display: inline-block;
        }

        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }

        /* START SCREEN */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            background: var(--bg);
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 2.3rem;
            color: #1e3c5c;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #ffdd99;
            background: rgba(255,255,200,0.6);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 80px;
            backdrop-filter: blur(2px);
        }

        .play-btn-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-top: 20px;
        }

        .play-btn-container:active {
            transform: scale(0.96);
        }

        .play-icon {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.25);
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .play-icon svg {
            width: 52px;
            height: 52px;
            fill: white;
            margin-left: 8px;
        }

        .play-label {
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            background: var(--primary-dark);
            padding: 10px 40px;
            border-radius: 50px;
            letter-spacing: 2px;
            box-shadow: 0 6px 0 #1b5e20;
        }

        /* GAME CONTAINER */
        #game-container {
            display: none;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            text-align: center;
            flex-direction: column;
            padding: 12px 16px 20px;
            background: var(--bg);
            min-height: 100vh;
            justify-content: center;
        }

        .instruction-box {
            background: rgba(255, 251, 240, 0.95);
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            color: #1e3c5c;
            display: inline-block;
            width: auto;
            backdrop-filter: blur(4px);
        }

        /* CHARACTER ROW - SEMUA DALAM SATU BARIS, TIDAK TURUN KE BAWAH */
        .character-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 12px;
            margin: 10px 0 20px;
            padding: 12px 8px;
            overflow-x: auto;
            overflow-y: visible;
            flex-wrap: nowrap;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }

        .char-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 130px;
            min-width: 130px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(251, 193, 148, 0.6);
            border-radius: 32px;
            padding: 12px 8px 8px;
            scroll-snap-align: start;
            backdrop-filter: blur(2px);
        }

        .char-wrapper:active {
            transform: scale(0.97);
        }

        .char-img {
            width: 100%;
            height: auto;
            max-height: 170px;
            object-fit: contain;
            border-radius: 24px;
            background: #fbbf92;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: block;
        }

        /* Floating label nama */
        .temp-name-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffdd77;
            color: #1e3c2c;
            padding: 6px 18px;
            border-radius: 48px;
            font-weight: 800;
            font-size: 1.2rem;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            z-index: 30;
            animation: bouncePulse 0.5s ease forwards;
            pointer-events: none;
            border: 2px solid gold;
        }

        @keyframes bouncePulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7);}
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1);}
            40% { transform: translate(-50%, -50%) scale(1);}
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1);}
        }

        #question-area {
            background: rgba(255, 248, 230, 0.9);
            border-radius: 56px;
            padding: 16px 10px;
            margin: 10px auto;
            width: 95%;
            max-width: 650px;
            backdrop-filter: blur(8px);
        }

        #question-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #003366;
            background: #fff2df;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 48px;
            margin: 6px 0;
            box-shadow: inset 0 1px 4px #0001, 0 5px 12px rgba(0,0,0,0.05);
        }

        .number-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .btn-number {
            padding: 12px 22px;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, var(--secondary), var(--secondary-dark));
            color: white;
            cursor: pointer;
            min-width: 75px;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 7px 0 #0d3c5c;
        }

        .btn-number:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0d3c5c;
        }

        .btn-play-again {
            padding: 14px 32px;
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #2e7d32);
            color: white;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            margin: 20px auto 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: 0.1s linear;
            display: inline-block;
        }

        .btn-play-again:active {
            transform: scale(0.96);
        }

        #feedback {
            font-weight: bold;
            margin-top: 16px;
            min-height: 70px;
            font-size: 1.2rem;
            padding: 12px 20px;
            background: #fdf8efee;
            border-radius: 48px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            color: #2c3e2f;
            transition: 0.2s;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .char-wrapper {
                width: 110px;
                min-width: 110px;
            }
            .char-img {
                max-height: 140px;
            }
            .btn-number {
                padding: 8px 18px;
                font-size: 1.5rem;
                min-width: 65px;
            }
            .instruction-box {
                font-size: 1rem;
            }
            #question-text {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 650px) {
            .char-wrapper {
                width: 100px;
                min-width: 100px;
                padding: 8px 5px;
            }
            .char-img {
                max-height: 125px;
            }
            .temp-name-label {
                font-size: 0.9rem;
                padding: 4px 12px;
            }
        }

        /* KONDISI PORTRAIT HP: tampilkan peringatan, sembunyikan start screen dan game */
        @media (orientation: portrait) and (max-width: 900px) {
            #landscape-warning {
                display: flex !important;
            }
            #game-container, #start-screen {
                display: none !important;
            }
        }

        /* Landscape: peringatan tidak muncul, start screen/game normal */
        @media (orientation: landscape) {
            #landscape-warning {
                display: none !important;
            }
        }

        @media (min-width: 1024px) {
            .character-row {
                justify-content: center;
                flex-wrap: nowrap;
                overflow-x: visible;
            }
            .char-wrapper {
                width: 150px;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>

<div id="landscape-warning">
    <div class="rotate-icon">🔄</div>
    <h2>Mode <em>Landscape</em> Diperlukan</h2>
    <p>Putar HP-mu ke posisi <strong>MENDATAR (<em>landscape</em>)</strong> untuk bermain!</p>
    <p>✨ Setelah diputar, halaman akan otomatis siap ✨</p>
</div>

<!-- Layar Awal -->
<div id="start-screen">
    <h1>Ayo main!</h1>
    <div class="play-btn-container" id="mainButton">
        <div class="play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="play-label">MULAI</div>
    </div>
    <p style="margin-top: 40px; font-weight:500; background:#ffffffaa; padding:8px 18px; border-radius:40px;">Klik anak, dengar namanya, lalu jawab posisi!</p>
</div>

<!-- Kontainer Utama Game -->
<div id="game-container">
    <div class="instruction-box" id="instruction">
        🎈 Klik gambar anak untuk tahu namanya! 🎈
    </div>

    <div class="character-row" id="char-area"></div>

    <div id="question-area" style="visibility: hidden;">
        <p id="question-text"></p>
        <div class="number-buttons">
            <button class="btn-number" data-num="1">1</button>
            <button class="btn-number" data-num="2">2</button>
            <button class="btn-number" data-num="3">3</button>
            <button class="btn-number" data-num="4">4</button>
            <button class="btn-number" data-num="5">5</button>
        </div>
    </div>

    <div id="feedback"></div>
    <button class="btn-play-again" id="btn-retry" style="display: none;">🔁 Main Lagi!</button>
</div>

<script>
    // DATA KARAKTER
    const characters = [
        { name: "Andi", img: "images/vm16_Andi.png" },
        { name: "Budi", img: "images/vm16_Budi.png" },
        { name: "Caca", img: "images/vm16_Caca.png" },
        { name: "Dani", img: "images/vm16_Dani.png" },
        { name: "Edo",  img: "images/vm16_Edo.png" }
    ];

    let currentOrder = [];
    let targetChar = null;
    let targetSide = "";
    let targetPos = 0;
    let isAnswered = false;
    let currentGameActive = false;

    function speak(text) {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.warn(e); }
    }

    function renderCharacters() {
        const charArea = document.getElementById('char-area');
        if (!charArea) return;
        charArea.innerHTML = "";
        
        currentOrder.forEach((char) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'char-wrapper';
            
            const img = document.createElement('img');
            img.className = 'char-img';
            img.src = char.img;
            img.alt = `Gambar ${char.name}`;
            img.onerror = function() {
                this.style.background = "#d9c2a7";
                this.style.padding = "20px";
                this.alt = char.name;
            };
            
            wrapper.onclick = (e) => {
                e.stopPropagation();
                speak(char.name);
                const oldLabel = wrapper.querySelector('.temp-name-label');
                if(oldLabel) oldLabel.remove();
                
                const label = document.createElement('div');
                label.className = 'temp-name-label';
                label.innerText = char.name;
                wrapper.appendChild(label);
                setTimeout(() => {
                    if(label && label.parentNode) label.remove();
                }, 1900);
            };
            
            wrapper.appendChild(img);
            charArea.appendChild(wrapper);
        });
        
        if (charArea.scrollWidth > charArea.clientWidth) {
            charArea.style.overflowX = "auto";
        }
    }

    function checkAnswer(num) {
        if (!currentGameActive) return;
        if (isAnswered) return;
        
        const feedbackDiv = document.getElementById('feedback');
        if (!feedbackDiv) return;
        
        if (num === targetPos) {
            const msg = `Hebat! Benar sekali ✨ ${targetChar.name} ada di urutan nomor ${num} dari ${targetSide}.`;
            feedbackDiv.innerText = msg + " 🎉🎉";
            feedbackDiv.style.color = "#1f6d1a";
            feedbackDiv.style.backgroundColor = "#e8f5e9";
            speak(msg);
        } else {
            const msg = `Yah kurang tepat. ${targetChar.name} sebenarnya ada di urutan nomor ${targetPos} dari ${targetSide}. Ayo main lagi!`;
            feedbackDiv.innerText = msg;
            feedbackDiv.style.color = "#a5260c";
            feedbackDiv.style.backgroundColor = "#fff0ed";
            speak(msg);
        }
        
        isAnswered = true;
        
        const retryBtn = document.getElementById('btn-retry');
        if (retryBtn) retryBtn.style.display = "inline-block";
        
        setTimeout(() => {
            if (retryBtn) retryBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function initGame() {
        const isPortrait = window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
        if (isPortrait) {
            speak("Putar layar ke posisi landscape dulu ya!");
            const warnDiv = document.getElementById('landscape-warning');
            if (warnDiv) warnDiv.style.display = 'flex';
            return;
        }
        
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        if (startScreen) startScreen.style.display = 'none';
        if (gameContainer) gameContainer.style.display = 'flex';
        
        startGame();
    }
    
    function startGame() {
        isAnswered = false;
        currentGameActive = true;
        const retryBtn = document.getElementById('btn-retry');
        if (retryBtn) retryBtn.style.display = "none";
        const feedbackDiv = document.getElementById('feedback');
        if (feedbackDiv) {
            feedbackDiv.innerText = "";
            feedbackDiv.style.color = "#1e3c5c";
            feedbackDiv.style.backgroundColor = "#fdf8efee";
        }
        
        currentOrder = [...characters];
        for (let i = currentOrder.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentOrder[i], currentOrder[j]] = [currentOrder[j], currentOrder[i]];
        }
        
        renderCharacters();
        
        const qArea = document.getElementById('question-area');
        if (qArea) qArea.style.visibility = "hidden";
        
        generateNewQuestion(true);
    }
    
    function generateNewQuestion(isInitial = false) {
        if (!currentOrder.length || !currentGameActive) return;
        
        const randomIndex = Math.floor(Math.random() * currentOrder.length);
        targetChar = currentOrder[randomIndex];
        targetSide = Math.random() > 0.5 ? "kiri" : "kanan";
        
        const idx = currentOrder.findIndex(ch => ch.name === targetChar.name && ch.img === targetChar.img);
        if (idx === -1) return;
        
        if (targetSide === "kiri") {
            targetPos = idx + 1;
        } else {
            targetPos = currentOrder.length - idx;
        }
        
        const questionText = `Dari ${targetSide}, ${targetChar.name} berada di urutan ke berapa?`;
        const qElement = document.getElementById('question-text');
        if (qElement) qElement.innerText = questionText;
        
        const qArea = document.getElementById('question-area');
        if (qArea) qArea.style.visibility = "visible";
        
        if (isInitial) {
            speak("Ayo main urutan nama! Klik setiap anak untuk tahu namanya. " + questionText);
        } else {
            speak(questionText);
        }
    }
    
    function handleOrientationAndVisibility() {
        const isPortraitBlock = window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const warningDiv = document.getElementById('landscape-warning');
        
        if (isPortraitBlock) {
            if (startScreen) startScreen.style.display = 'none';
            if (gameContainer) gameContainer.style.display = 'none';
            if (warningDiv) warningDiv.style.display = 'flex';
            currentGameActive = false;
            return;
        }
        
        if (warningDiv) warningDiv.style.display = 'none';
        
        if (gameContainer && gameContainer.style.display === 'flex') {
            currentGameActive = true;
            const charRow = document.getElementById('char-area');
            if (charRow) charRow.style.flexWrap = 'nowrap';
        } else {
            if (startScreen && gameContainer) {
                if (startScreen.style.display !== 'flex' && gameContainer.style.display !== 'flex') {
                    startScreen.style.display = 'flex';
                } else if (startScreen.style.display === 'none' && gameContainer.style.display === 'none') {
                    startScreen.style.display = 'flex';
                }
            }
        }
    }
    
    window.addEventListener('resize', () => setTimeout(handleOrientationAndVisibility, 50));
    window.addEventListener('orientationchange', () => setTimeout(handleOrientationAndVisibility, 80));
    
    document.addEventListener('DOMContentLoaded', () => {
        handleOrientationAndVisibility();
        
        // Tombol MULAI
        const mainBtn = document.getElementById('mainButton');
        if (mainBtn) {
            mainBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                initGame();
            };
        }

        // Tombol angka 1-5
        document.querySelectorAll('.btn-number').forEach(btn => {
            btn.addEventListener('click', function() {
                const val = parseInt(this.getAttribute('data-num'));
                if (!isNaN(val)) checkAnswer(val);
            });
        });

        // Tombol Main Lagi
        const retryBtn = document.getElementById('btn-retry');
        if (retryBtn) {
            retryBtn.addEventListener('click', startGame);
        }
    });
</script>
</body>
</html>
